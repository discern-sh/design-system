<style>
#discern-icon-materials {
  --dim-paper: light-dark(#f7f7f6, #191a1c);
  --dim-surface: light-dark(#ffffff, #222426);
  --dim-ink: light-dark(#30363d, #e0e4e8);
  --dim-muted: light-dark(#62666d, #afb4bc);
  --dim-rule: light-dark(#dedfe1, #41454b);
  --dim-edge: light-dark(#8a9098, #68717e);
  --dim-highlight: light-dark(#ffffff, #f8fcff);
  --dim-shadow: light-dark(#323b4b30, #0000008c);
  --dim-ground: light-dark(#4852631a, #00000040);
  --dim-relief: 1px;
  --dim-cast: 6px;
  --dim-x: 12deg;
  --dim-y: -16deg;
  --dim-z: -7deg;
  color: var(--dim-ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
#discern-icon-materials * { box-sizing: border-box; }
#discern-icon-materials .dim-controls { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 14px; margin-bottom: 10px; }
#discern-icon-materials .dim-field { display: flex; flex-direction: column; min-width: 0; gap: 6px; color: var(--dim-muted); font-size: 13px; }
#discern-icon-materials .dim-field-heading { display: flex; justify-content: space-between; gap: 12px; }
#discern-icon-materials .dim-field output { color: var(--dim-ink); font-variant-numeric: tabular-nums; }
#discern-icon-materials .dim-field select { width: 100%; min-width: 0; min-height: 38px; padding: 7px 10px; border: 1px solid var(--dim-rule); border-radius: 5px; background: var(--dim-surface); color: var(--dim-ink); font: inherit; }
#discern-icon-materials .dim-field input[type="range"] { width: 100%; min-width: 0; margin: 0; height: 38px; accent-color: var(--dim-ink); }
#discern-icon-materials .dim-options { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 19px; }
#discern-icon-materials .dim-check { display: inline-flex; gap: 8px; align-items: center; min-height: 32px; color: var(--dim-ink); font-size: 13px; cursor: pointer; }
#discern-icon-materials .dim-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--dim-ink); }
#discern-icon-materials .dim-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px; }
#discern-icon-materials .dim-labels h3 { margin: 0; font: inherit; font-size: 13px; color: var(--dim-muted); font-weight: 400; }
#discern-icon-materials .dim-labels strong { color: var(--dim-ink); font-weight: 500; margin-right: 10px; }
#discern-icon-materials .dim-board { position: relative; isolation: isolate; overflow: hidden; background: var(--dim-paper); color: var(--dim-ink); border: 1px solid var(--dim-rule); border-radius: 10px; }
#discern-icon-materials .dim-row { display: grid; grid-template-columns: 1fr 1fr; }
#discern-icon-materials .dim-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
#discern-icon-materials .dim-cell + .dim-cell { border-left: 1px solid var(--dim-rule); }
#discern-icon-materials .dim-large { min-height: 218px; padding: 26px 16px 22px; gap: 20px; }
#discern-icon-materials .dim-symbol { display: inline-flex; color: var(--dim-ink); line-height: 0; }
#discern-icon-materials .dim-symbol svg { display: block; width: 96px !important; height: 96px !important; stroke-width: 1.8; }
#discern-icon-materials .dim-object { position: relative; transform: perspective(600px) rotateX(var(--dim-x)) rotateY(var(--dim-y)) rotateZ(var(--dim-z)); transform-origin: center; }
#discern-icon-materials .dim-object::after { content: ""; position: absolute; left: 10%; right: -8%; bottom: -15px; height: 12px; border-radius: 50%; background: var(--dim-ground); filter: blur(7px); z-index: -1; }
#discern-icon-materials .dim-object .dim-symbol {
  filter: drop-shadow(var(--dim-relief) var(--dim-relief) 0 var(--dim-edge))
          drop-shadow(var(--dim-relief) var(--dim-relief) 0 var(--dim-edge))
          drop-shadow(-.5px -.7px 0 var(--dim-highlight))
          drop-shadow(2px var(--dim-cast) 4px var(--dim-shadow));
}
#discern-icon-materials .dim-caption { color: var(--dim-muted); font-size: 12px; }
#discern-icon-materials .dim-small-row { border-top: 1px solid var(--dim-rule); }
#discern-icon-materials .dim-small { min-height: 103px; padding: 18px 12px; gap: 9px; }
#discern-icon-materials .dim-button { display: inline-flex; gap: 8px; align-items: center; justify-content: center; color: var(--dim-ink); background: var(--dim-surface); border: 1px solid var(--dim-rule); border-radius: 5px; box-shadow: 0 2px 0 var(--dim-edge); padding: 9px 13px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: transform 100ms ease-out, box-shadow 100ms ease-out; }
#discern-icon-materials .dim-button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--dim-edge); }
#discern-icon-materials .dim-button[aria-pressed="true"] { color: var(--dim-surface); background: var(--dim-ink); border-color: var(--dim-ink); }
#discern-icon-materials .dim-small .dim-symbol { color: inherit; }
#discern-icon-materials .dim-small .dim-symbol svg { width: 18px !important; height: 18px !important; stroke-width: 1.8; }
#discern-icon-materials[data-small-depth="true"] .dim-small-relief .dim-symbol { filter: drop-shadow(.35px .5px .2px var(--dim-shadow)); }
#discern-icon-materials .dim-status { min-height: 1.5em; padding-top: 8px; color: var(--dim-muted); font-size: 12px; }
@media (max-width: 410px) {
  #discern-icon-materials .dim-controls { grid-template-columns: 1fr 1fr; }
  #discern-icon-materials .dim-field:last-child { grid-column: 1 / -1; }
  #discern-icon-materials .dim-large { min-height: 194px; padding: 25px 10px 18px; }
  #discern-icon-materials .dim-symbol svg { width: 78px !important; height: 78px !important; }
  #discern-icon-materials .dim-button { font-size: 12px; padding: 10px; }
  #discern-icon-materials .dim-small .dim-symbol svg { width: 16px !important; height: 16px !important; }
}
@media (pointer: coarse) { #discern-icon-materials .dim-button, #discern-icon-materials .dim-check, #discern-icon-materials .dim-field select, #discern-icon-materials .dim-field input[type="range"] { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { #discern-icon-materials .dim-button { transition: none; } }
</style>
<div id="discern-icon-materials" aria-label="Flat and dimensional SVG symbol studies" data-small-depth="false">
  <div class="dim-controls" role="group" aria-label="Comparison controls">
    <label class="dim-field" for="dim-icon-choice">Symbol
      <select id="dim-icon-choice" data-control="icon">
        <option value="branch">Branch</option><option value="merge">Merge</option><option value="layers">Layers</option><option value="shield">Shield</option>
      </select>
    </label>
    <label class="dim-field" for="dim-theme-choice">Appearance
      <select id="dim-theme-choice" data-control="theme">
        <option value="system">Follow app</option><option value="light">Light</option><option value="dark">Dark</option>
      </select>
    </label>
    <label class="dim-field" for="dim-relief-choice">
      <span class="dim-field-heading"><span>Relief depth</span><output id="dim-relief-value" for="dim-relief-choice">1.00</output></span>
      <input id="dim-relief-choice" data-control="relief" type="range" min="0.25" max="1.75" step="0.25" value="1">
    </label>
  </div>
  <div class="dim-options" role="group" aria-label="Optional treatments">
    <label class="dim-check"><input data-control="tilt" type="checkbox" checked>Slight angle</label>
    <label class="dim-check"><input data-control="smallDepth" type="checkbox">Depth on small icons</label>
  </div>
  <div class="dim-labels"><h3><strong>A</strong>Graphic</h3><h3><strong>B</strong>Shallow relief</h3></div>
  <div class="dim-board">
    <div class="dim-row">
      <div class="dim-cell dim-large" aria-label="Flat branching symbol at marketing size">
        <span class="dim-symbol" data-symbol><i data-lucide="git-branch" aria-hidden="true"></i></span>
        <span class="dim-caption">Marketing</span>
      </div>
      <div class="dim-cell dim-large" aria-label="Dimensional branching symbol at marketing size">
        <div class="dim-object"><span class="dim-symbol" data-symbol><i data-lucide="git-branch" aria-hidden="true"></i></span></div>
        <span class="dim-caption">Marketing</span>
      </div>
    </div>
    <div class="dim-row dim-small-row">
      <div class="dim-cell dim-small">
        <button class="dim-button" type="button" aria-pressed="false"><span class="dim-symbol" data-symbol><i data-lucide="git-branch" aria-hidden="true"></i></span><span class="dim-action-label">Branch</span></button>
        <span class="dim-caption">Interface</span>
      </div>
      <div class="dim-cell dim-small dim-small-relief">
        <button class="dim-button" type="button" aria-pressed="false"><span class="dim-symbol" data-symbol><i data-lucide="git-branch" aria-hidden="true"></i></span><span class="dim-action-label">Branch</span></button>
        <span class="dim-caption">Interface</span>
      </div>
    </div>
  </div>
  <div class="dim-status" role="status" aria-live="polite"></div>
</div>
<script>
(() => {
  const root = document.getElementById('discern-icon-materials');
  const state = { icon: 'branch', relief: 1, tilt: true, smallDepth: false, theme: 'system' };
  const icons = {
    branch: { name: 'git-branch', label: 'Branch', description: 'branching' },
    merge: { name: 'git-merge', label: 'Merge', description: 'merging' },
    layers: { name: 'layers-2', label: 'Layers', description: 'layered' },
    shield: { name: 'shield-check', label: 'Verify', description: 'verification' }
  };
  let renderedIcon = state.icon;
  let pressed = false;
  const buttons = Array.from(root.querySelectorAll('.dim-button'));
  function render() {
    root.querySelector('#dim-relief-value').textContent = state.relief.toFixed(2);
    root.querySelector('.dim-board').style.colorScheme = state.theme === 'system' ? '' : state.theme;
    root.style.setProperty('--dim-relief', state.relief + 'px');
    root.style.setProperty('--dim-cast', (state.relief * 3 + 3) + 'px');
    root.style.setProperty('--dim-x', state.tilt ? '12deg' : '0deg');
    root.style.setProperty('--dim-y', state.tilt ? '-16deg' : '0deg');
    root.style.setProperty('--dim-z', state.tilt ? '-7deg' : '0deg');
    root.dataset.smallDepth = String(state.smallDepth);
    const selected = icons[state.icon];
    if (renderedIcon !== state.icon) {
      renderedIcon = state.icon;
      for (const holder of root.querySelectorAll('[data-symbol]')) {
        const placeholder = document.createElement('i');
        placeholder.setAttribute('data-lucide', selected.name);
        placeholder.setAttribute('aria-hidden', 'true');
        holder.replaceChildren(placeholder);
      }
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    for (const label of root.querySelectorAll('.dim-action-label')) label.textContent = selected.label;
    const panels = root.querySelectorAll('.dim-large');
    panels[0].setAttribute('aria-label', 'Flat ' + selected.description + ' symbol at marketing size');
    panels[1].setAttribute('aria-label', 'Dimensional ' + selected.description + ' symbol at marketing size');
  }
  for (const button of buttons) {
    button.addEventListener('click', () => {
      pressed = !pressed;
      for (const peer of buttons) peer.setAttribute('aria-pressed', String(pressed));
      root.querySelector('.dim-status').textContent = icons[state.icon].label + (pressed ? ' selected.' : ' deselected.');
    });
  }
  for (const control of root.querySelectorAll('[data-control]')) {
    control.addEventListener('input', () => {
      const key = control.dataset.control;
      state[key] = control.type === 'checkbox' ? control.checked : control.type === 'range' ? Number(control.value) : control.value;
      if (key === 'icon') {
        pressed = false;
        for (const button of buttons) button.setAttribute('aria-pressed', 'false');
        root.querySelector('.dim-status').textContent = '';
      }
      render();
    });
  }
  render();
})();
</script>
