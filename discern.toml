#:schema https://discern.sh/schema/v1/discern-config.schema.json
# Generated automatically by discern via the bundled project configuration template | https://discern.sh
#
# discern is a stack-neutral system for coding agents and their humans.
# Use discern.toml to teach discern about your project, preferences, and tooling.
#
# The quickest way to get started is to simply tell your coding agent:
#   "Run `discern setup` and follow the instructions.".
#
# Help is always available through the command line or MCP server:
#   - Read the documentation:   `discern docs`   | MCP: `discern_docs`
#   - Verify your installation: `discern doctor` | MCP: `discern_doctor`
#   - Show the current status:  `discern status` | MCP: `discern_status`
#   - Refresh after an update:  `discern upgrade`
#
# Generated by discern 1.0.0 for "discern-design-system".

# ─────────────────────────────────────────────────────────────────────────────
# [project]
#
# What:    The project's identity and the paths discern keeps for it.
# Why:     The name and slug appear in worktree, branch, and site names and in
#          every compiled instruction file, so agents and humans see one
#          identity everywhere.
#
# Help:    `discern config explain project`
# ─────────────────────────────────────────────────────────────────────────────

[project]
  # Display name, free text, used when compiled instructions address the
  # project. Empty falls back to the slug.
  name = "discern Design System"

  # Short, lowercase, dash-separated identity, used in worktree, site, and
  # branch names.
  slug = "discern-design-system"

  # The doc the Gate points an agent at when a stage fails in a non-obvious
  # way. Keep it current with your stack's traps; empty disables the pointer.
  gotchas_doc = "map/80-development/done-gate-gotchas.md"

  # The deferred-work ledger: the running TODO list agents read and maintain,
  # relative to the project root.
  todo = "discern/TODO.md"

  # When true, record one line of local, metadata-only history per verb run:
  # timings, outcomes, and names, with no code or output. Files stay under
  # .git, outside commits and any network; false stops all writes.
  # Recording on is recommended. History cannot be recorded after the fact,
  # and while recording is off this project goes without:
  #   - the practice report (`discern patterns`)
  #   - each worktree's last action and work in flight
  #   - fleet activity times that include verb runs
  #   - configuration-change attribution and each Standard's limit history
  #   - advisory findings on `status`, the `done` Proof, and `improvement`
  #   - wait estimates when concurrent test runs queue
  #   - the in-flight check on the contained-worktree offer
  #   - observed checkpoint economics (`discern checkpoints`)
  #   - Logbook storage checks in `discern doctor`
  logbook = true

  # Which agent integrations to enable: claude_code, codex, gemini, cursor,
  # copilot. Omit the key for the default pair (claude_code, codex); an
  # explicit empty list emits for no agent.
  # Agent files:
  #   "claude_code" -> CLAUDE.md   "codex" -> AGENTS.md   "gemini" -> GEMINI.md
  #   "cursor" -> AGENTS.md   "copilot" -> AGENTS.md
  agents = ["claude_code", "codex", "gemini", "cursor", "copilot"]

# ─────────────────────────────────────────────────────────────────────────────
# [repository]
#
# What:    Policy every checkout of this repository shares.
# Why:     The trunk is where accepted work lands and where the Gate compares
#          from. Branch naming and convergence commands keep the main checkout
#          and every linked worktree usable after their tracked tree changes.
#
# Help:    `discern config explain repository`
# ─────────────────────────────────────────────────────────────────────────────

[repository]
  # The shared branch the Gate compares against and completed work lands on.
  # Detected at setup; DISCERN_TRUNK overrides it per invocation.
  trunk = "main"

  # Branch prefix for worktrees created by discern, e.g. "agent/my-feature".
  branch_prefix = "agent/"

  # "local" records landed proof notes in this clone only; "fetch" adds a
  # fetch-only mapping per remote so ordinary fetches carry them. Publishing
  # stays an explicit `git push <remote> refs/notes/discern`.
  proof_notes = "local"

  # Idempotent commands that make any checkout usable for its tracked tree,
  # such as installing dependencies from a lockfile. They run in order on every
  # worktree pass and after a landing.
  ensure = [
    "deno install --frozen",
    "deno task build",
  ]

# ─────────────────────────────────────────────────────────────────────────────
# [map]
#
# What:    Where the project map lives.
# Why:     The map is the documentation tree agents maintain and `discern map`
#          browses. Its location also feeds the `${map.dir}` reference other
#          sections use.
#
# Help:    `discern config explain map`
# ─────────────────────────────────────────────────────────────────────────────

[map]
  # Where the project map lives, relative to the project root. `discern setup`
  # scaffolds it here and `discern map` browses it.
  dir = "map/"

# ─────────────────────────────────────────────────────────────────────────────
# [instructions]
#
# What:    The instruction sources discern compiles into each agent's file.
# Why:     You write instructions once. `discern refresh` compiles discern's
#          built-in instructions plus your sources into one generated file per
#          agent, committed so every agent reads the same page and no generated
#          file is edited by hand.
#
# Help:    `discern config explain instructions`
# ─────────────────────────────────────────────────────────────────────────────

[instructions]
  # Your instruction source files or globs, relative to the project root. Read
  # only when present; discern's built-in instructions are always prepended, so
  # these are additive. `discern setup` seeds a starter here.
  sources = ["discern/instructions.md"]

# ─────────────────────────────────────────────────────────────────────────────
# [skills]
#
# What:    Where your authored skills live, and which skills to leave out.
# Why:     A skill is a focused, reusable playbook. discern materializes its
#          bundled skills plus yours into each agent's skills directory; a
#          skill of yours with the same name as a built-in replaces it.
#
#   discern skills list          the effective set, and your overrides
#   discern skills eject <name>  copy a built-in here to customize it
#
# Help:    `discern config explain skills`
# ─────────────────────────────────────────────────────────────────────────────

[skills]
  # Where your authored skills live, relative to the project root. Read only
  # when present, so a project with no authored skills uses the built-ins.
  dir = "discern/skills"

  # Skill names, bundled or authored, to leave out of materialization. Each
  # materialized skill occupies context in every agent session, so exclude what
  # this project never needs; an unknown name warns and never fails.
  exclude = []

# ─────────────────────────────────────────────────────────────────────────────
# [setup]
#
# What:    Known jobs that do not apply to this project.
# Why:     Setup measures how many applicable known jobs are wired. A lifecycle
#          the project does not have is declared here, so the measure counts
#          what exists; the Gate's schedule still comes from [jobs].
#
#   discern config set-job build --not-applicable   declare one
#   discern config set-job build --applicable       restore it
#
# Help:    `discern config explain setup`
# ─────────────────────────────────────────────────────────────────────────────

[setup]
  # Known jobs this project's lifecycle does not have. A job listed here cannot
  # also be configured under [jobs].
  not_applicable = []

# ─────────────────────────────────────────────────────────────────────────────
# [generated.<name>]
#
# What:    Committed artifacts that one generator owns.
# Why:     `discern prepare` and `discern done` rerun each generator and fail
#          when the committed bytes differ, so a generated file cannot drift
#          from its source and nobody edits it by hand.
#
# Params:  paths, run, linguist_generated, timeout
# Help:    `discern config explain generated`
# ─────────────────────────────────────────────────────────────────────────────

[generated]

  [generated.codegen]
    paths = [
      "src/generated/**",
      "scripts/generated/**",
      "skills/use-discern-design-system/evals/**",
    ]
    run = "deno task codegen"
    linguist_generated = true
    timeout = 120

# ─────────────────────────────────────────────────────────────────────────────
# [jobs]
#
# What:    The commands the Gate runs, in one namespace.
# Why:     A known name derives its stage; a custom `[jobs.<name>]` table
#          declares one. `discern done` runs the fix stage, then build, then
#          check and test in parallel, and reports what each command returned,
#          so done means the project's own bar was met.
#
# A value is one command, a list run in order, or a table giving the job
# its own time budget: test = { run = "npm test", timeout = 1200 }.
# Leave a known job unwired until its command exists; `discern setup` has
# your coding agent fill these from repository evidence.
#
# Custom:  stage, run, provides, timeout
# Help:    `discern config explain jobs`
# ─────────────────────────────────────────────────────────────────────────────

[jobs]
  # The unit suites plus the complete browser conformance pass legitimately
  # outgrow the default 600s budget; the run is single-shot and always exits.
  test = { run = "deno task test", timeout = 1500 }
  build = "deno task build && deno task check:catalogue"
  typecheck = "deno task typecheck"
  lint = "deno task lint"
  format = ["deno task fix", "discern tidy"]
  # format    = "prettier --write ."   # or "ruff format ." or "gofmt -w ."
  # build     = "npm run build"        # or "cargo build"
  # lint      = "eslint ."             # or "ruff check ." or "golangci-lint run"
  # typecheck = "tsc --noEmit"         # or "mypy ."
  # test      = "npm test"             # or "pytest" or "go test ./..."
  # smoke     = "your-app --version"   # a fast "does it boot?" — a CLI --version,
  #                                    # a framework's inspire/about, a config-load-and-exit

  # A custom job: any name, an explicit stage, and its command.
  # [jobs.licenses]
    # stage    = "check"
    # run      = "./scripts/check-licenses.sh"
    # provides = "license-audit"

# ─────────────────────────────────────────────────────────────────────────────
# [scopes.<name>]
#
# What:    Named regions of the repository.
# Why:     A change inside a scope can skip the Gate, run its own gate, or
#          offer a preview. A path that matches no scope counts as code and
#          runs every stage.
#
# Params:  paths, neutral, preview, gate, timeout
# Help:    `discern config explain scopes`
# ─────────────────────────────────────────────────────────────────────────────

# Paths that need no gate at all: docs and agent-instruction sources. (Generated
# instruction outputs are refreshed by the gate itself; editing the source changes
# no behaviour.) Root-level *.md is always treated as neutral.
[scopes.map]
  paths = [
    "discern/instructions.md",
    "${map.dir}",
    "${skills.dir}/",
    "${project.todo}",
    "discern/brief.md",
    ".claude/skills/",
    ".agents/skills/",
  ]
  neutral = true

# Agent-instruction surfaces: the project brief, authored instructions and skills,
# and the exact materialized-skills directories compiled from them. Gate-neutral
# like the map scope, but outside the [acceptance] example: these files steer
# agents, so landing them stays owner-reviewed. Executable Project Scripts and
# provider-owned sibling files still run the gate.
[scopes.instructions]
  paths = [
    "discern/instructions.md",
    "${skills.dir}/",
    ".claude/skills/",
    ".agents/skills/",
  ]
  neutral = true

# The subset of changes a person could see — worth a preview link. Backs the
# instruction "Ship visible changes with a preview": a change touching these
# paths is flagged as preview-worthy, so hand off the Catalogue URL on the
# worktree's deterministic port (`discern identity --port`).
[scopes.visual]
  paths = [
    "src/components/**",
    "src/styles/**",
    "src/tokens/**",
    "catalogue/**",
    "assets/**",
  ]
  preview = "discern script serve"

# A sub-component with its own self-contained gate:
# [scopes.native]
  # paths = ["native/**"]
  # gate  = "make -C native check"

# ─────────────────────────────────────────────────────────────────────────────
# [acceptance]
#
# What:    Standing grants for landing without a conversation.
# Why:     Landing needs the owner's acceptance in the conversation unless a
#          scope is named here. Widening a named scope widens its grant; the
#          example grants documentation alone and keeps agent instructions
#          owner-reviewed.
#
# Help:    `discern config explain acceptance`
# ─────────────────────────────────────────────────────────────────────────────

[acceptance]
  # Scope names whose changes may land without a per-landing conversation. An
  # owner decision recorded on the trunk: widening a named scope widens its
  # grant. Empty means every landing needs the owner's acceptance.
  pre_authorized = [] # e.g. ["map"]

# ─────────────────────────────────────────────────────────────────────────────
# [worktree]
#
# What:    The isolated-worktree workflow.
# Why:     Each effort runs in its own checkout, so parallel agents never
#          collide. The git mechanics are generic; the resources and setup
#          commands below are what make a fresh worktree ready for this
#          project.
#
# Help:    `discern config explain worktree`
# ─────────────────────────────────────────────────────────────────────────────

[worktree]
  # Where per-worktree checkouts are created. Empty means a sibling of the
  # repository, "<repo>.worktrees", outside the checkout. A relative path
  # resolves against the repo root; absolute is used as-is.
  root = ""

  # Environment values copied from the main checkout's env files into a new
  # worktree's: secrets a fresh worktree needs that are not in version control.
  # The worktree's env file is created when absent.
  inherit_env = [] # e.g. ["APP_KEY", "OPENAI_API_KEY"]

  # The env files the worktree lifecycle reads and writes, in precedence order:
  # on read the last file that defines a value wins; a new value lands in the
  # first. They also carry the port and resource handles.
  env_files = [".env", ".env.local"]

  # Record each worktree's deterministic dev-server port in its env files, for
  # tooling that reads DISCERN_WORKTREE_PORT. `discern identity --port` reports
  # it either way.
  port = true

  # Track ignored files at worktree setup and report the top-level ignored
  # paths that changed before the worktree is removed. Turn it off when ignored
  # outputs churn too much to be useful.
  ignored_file_drift = true

  # ───────────────────────────────────────────────────────────────────────────
  # [worktree.resources.<name>]
  #
  # What:    External resources provisioned per worktree.
  # Why:     Give each worktree a deterministic database, emulator, container,
  #          or queue handle. Resources are created top to bottom and destroyed
  #          bottom to top. discern records intent before create, cleans
  #          uncertain partial state before retry, and lets `discern worktree
  #          prune` reclaim a vanished worktree's recorded state.
  #
  # Runtime tokens, expanded per worktree when a command runs:
  #   @db@            a database-name-safe identity
  #   @site@          a DNS-safe dev-server site or host name
  #   @port@          the deterministic dev-server port
  #   @project_slug@  the project slug
  #   @dir@           this worktree's root
  #   @worktree@      this worktree's base handle (slug-id)
  #   @resource@      this resource's handle (slug-id-name)
  #
  # Params:  create, destroy, ensure, required, retries, gc
  # Help:    `discern config explain worktree.resources`
  # ───────────────────────────────────────────────────────────────────────────

  # A per-worktree database, so tests never clash. Uses @db@ (db-name-safe).
  # [worktree.resources.db]
    # create  = "createdb -T @project_slug@_template @db@"
    # destroy = "dropdb --if-exists @db@"

  # A per-worktree dev-server site (a Docker vhost, an ngrok tunnel, a reverse-proxy
  # entry, …). Uses @site@ (DNS-safe). Declared after db so it is torn down first.
  # [worktree.resources.dev_server]
    # create  = "link-site @site@ @port@"
    # destroy = "unlink-site @site@"

  # Any other isolated resource — an emulator, a queue, a bucket, a namespace.
  # [worktree.resources.example]
    # create   = "make-thing @resource@"
    # destroy  = "destroy-thing @resource@"   # idempotent: may re-run via worktree prune
    # ensure   = "ensure-thing @resource@"   # optional: reconcile drift at session start
    # required = true                          # optional: false = create failure is non-fatal
    # retries  = 0                             # optional: retry create/destroy N times
    # gc       = true                          # optional: false = never orphan-prune it
  #                                          #   (teardown-only; for data-loss-sensitive ones)

  # Worktree setup commands, run after the resources are provisioned — two buckets,
  # the same split as a resource's create/ensure:
  #   steps   one-shot scaffolding, run ONCE at creation and not re-run (skipped once
  #           the worktree is configured): seed fixtures, generate a local-only file.
  #   ensure  convergence, re-run on EVERY pass — at creation, on session-start
  #           re-entry, and after `discern update` brings main in — so the worktree
  #           tracks the current tree: install dependencies, build, run migrations.
  #           Author each idempotent (it re-runs routinely); prefer a fast-when-current
  #           command (`<install> check || <install>`) — the per-pass cost is yours.
  # Both run in order via `sh -c`. A failed `ensure` aborts setup at creation; on a
  # re-entry or update it is recorded but never undoes a merge or blocks startup.

  # ───────────────────────────────────────────────────────────────────────────
  # [worktree.setup]
  #
  # What:    Commands that ready a linked worktree.
  # Why:     `steps` run once at creation. `ensure` runs on every pass,
  #          including session start and `discern update`, so each command must
  #          be idempotent. Checkout-generic installs belong in
  #          [repository].ensure so acceptance converges the trunk too.
  #
  # Help:    `discern config explain worktree.setup`
  # ───────────────────────────────────────────────────────────────────────────

  [worktree.setup]
    # Commands run once at worktree creation, in order, after the resources
    # exist: one-shot scaffolding such as seeding fixtures.
    steps = [] # e.g. ["seed-fixtures"]

    # Commands run on every linked-worktree pass: creation, session start, and
    # after `discern update`. For convergence that depends on worktree
    # identity, ports, or resources; the main checkout never runs them.
    ensure = [] # e.g. ["ready-worktree-resource"]

# ─────────────────────────────────────────────────────────────────────────────
# [standards.<name>]
#
# What:    Quality numbers that can never get worse.
# Why:     Every `discern done` measures each standard beside the tests and
#          refuses a limit looser than the trunk's, so a branch can neither
#          regress a metric nor lower its bar. Hold a raw count for an
#          invariant, a rate through `per` for a quality that scales, and give
#          a total that grows with the product a `margin`.
#
# A run reports its number with one line: DISCERN_METRIC <name> <number>
# Lock in a gain with `discern standards --pin`; a hand-edited limit cannot
# tell a gain from a loosening.
#
# Params:  metric, direction, limit, run, per, scale, margin, measure, inputs,
#          timeout
# Help:    `discern config explain standards`
# ─────────────────────────────────────────────────────────────────────────────

# CSS density: emitted bytes per component stylesheet, so the number a new
# component moves is its own cost, not the catalogue's size. A raw total would
# only ever grow as the catalogue deliberately grows; the rate stays comparable
# forever and may only fall. (The full-catalogue byte count remains visible in
# the measurement output; the consumer-facing budget is [standards.docs_selection].)
[standards.css_density]
  run = "[ -f dist/discern.css ] || deno task build >/dev/null 2>&1; printf 'DISCERN_METRIC css_bytes %s\\n' \"$(wc -c < dist/discern.css | tr -d ' ')\""
  limit = 2483.964285714286
  direction = "down"
  metric = "css_bytes"
  per = { files = "src/components/**/*.css" }
  # Replay the last measurement when nothing that shapes the CSS changed.
  inputs = ["src/**", "scripts/**"]
  # Headroom `discern standards --pin` leaves so ordinary token/component
  # work never trips a freshly pinned ceiling.
  margin = 100

# The consumer-facing raw budget: the bytes a documentation site receives
# from `groups: ["Docs"]`. Unlike the full catalogue, this number does not
# grow when unrelated groups gain components — it is the true shipped cost.
# The 33 kB ceiling deliberately accommodates the glossary term component and
# its general-purpose hover-card dependency, with headroom for ordinary drift.
[standards.docs_selection]
  run = "deno run --config deno.json --allow-read --allow-write scripts/measure.ts"
  limit = 46612
  direction = "down"
  metric = "docs_selection_bytes"
  inputs = ["src/**", "scripts/**"]
  margin = 1000

# A small long-form documentation route: Docs header, Docs nav, Anchor
# heading, Prose, Code listing, and Pager, plus resolved dependencies. The
# 30 kB ceiling includes Code listing's standard and showcase treatments,
# with headroom for ordinary iteration and a warning before it is exhausted.
[standards.minimal_docs_css]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts minimal_docs_css_bytes"
  limit = 40918
  direction = "down"
  metric = "minimal_docs_css_bytes"
  inputs = ["src/**", "scripts/generate.ts", "${scripts.dir}/measure-runtime.ts"]
  margin = 1500

# The complete Workflow grammar selected by its canonical Group, including
# every dependency the Runtime Manifest resolves.
[standards.workflow_css]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts workflow_css_bytes"
  limit = 85064
  direction = "down"
  metric = "workflow_css_bytes"
  inputs = ["src/**", "scripts/generate.ts", "${scripts.dir}/measure-runtime.ts"]

# Marketing CSS density: emitted bytes per Marketing component stylesheet.
# The complete Group is still measured with resolved dependencies, but its raw
# total grows with healthy additions; the rate holds each addition to the same
# stable budget.
[standards.marketing_css]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts marketing_css_bytes"
  limit = 5043.625
  direction = "down"
  metric = "marketing_css_bytes"
  per = { files = "src/components/marketing/**/*.css" }
  inputs = ["src/**", "scripts/generate.ts", "${scripts.dir}/measure-runtime.ts"]
  margin = 100

# The selection-scoped discern.js produced by every Component in the closed
# behavior opt-in registry. CSS-only selections remain outside this measure.
[standards.behavior_script]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts behavior_script_bytes"
  limit = 6844
  direction = "down"
  metric = "behavior_script_bytes"
  inputs = [
    "src/**",
    "assets/behaviors/**",
    "scripts/generate.ts",
    "${scripts.dir}/measure-runtime.ts",
  ]

# Browser-transfer bytes for fonts.css and the four WOFF2 files. The three
# emitted OFL texts stay integrity-mapped but are not browser font requests.
[standards.font_transfer]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts font_transfer_bytes"
  limit = 183726
  direction = "down"
  metric = "font_transfer_bytes"
  inputs = [
    "src/**",
    "assets/fonts.css",
    "assets/fonts/**",
    "scripts/generate.ts",
    "${scripts.dir}/measure-runtime.ts",
  ]

# Browser-transfer bytes for grain.css and its one optional texture.
[standards.grain_transfer]
  run = "deno run --config deno.json --allow-read --allow-write ${scripts.dir}/measure-runtime.ts grain_transfer_bytes"
  limit = 99442
  direction = "down"
  metric = "grain_transfer_bytes"
  inputs = [
    "src/**",
    "assets/grain.css",
    "assets/textures/**",
    "scripts/generate.ts",
    "${scripts.dir}/measure-runtime.ts",
  ]

# Cap browser-test glue so resilience checks stay direct and bounded.
[standards.resilience_conformance_lines]
  metric = "resilience_conformance_lines"
  direction = "down"
  limit = 1712
  run = "printf 'DISCERN_METRIC resilience_conformance_lines %s\\n' \"$(wc -l < scripts/resilience-conformance.ts | tr -d ' ')\""
  inputs = ["scripts/resilience-conformance.ts"]

# Suppression directives stay at zero: the strict lint/type surface holds
# because nothing is ever silenced. Counts deno-lint-ignore, deno-fmt-ignore,
# @ts-ignore, and @ts-expect-error across authored (non-generated) sources.
[standards.lint_suppressions]
  metric = "lint_suppressions"
  direction = "down"
  limit = 0
  run = "printf 'DISCERN_METRIC lint_suppressions %s\\n' \"$(grep -rEn 'deno-lint-ignore|deno-fmt-ignore|@ts-ignore|@ts-expect-error' src scripts catalogue tests --include='*.ts' --include='*.tsx' | grep -v generated | wc -l | tr -d ' ')\""
  inputs = ["src/**", "scripts/**", "catalogue/**", "tests/**"]

# Missing CLI stances are permanent Codegen and type errors. This zero ceiling
# remains as a trunk-held second line of defence: a feature branch cannot
# delete a Standard, while the always-on rule rejects the first new instance.
[standards.cli_pending]
  metric = "cli_pending"
  direction = "down"
  limit = 0
  run = "deno run --config deno.json --allow-read ${scripts.dir}/measure-cli-pending.ts"
  inputs = [
    "src/components/**/*.meta.ts",
    "src/components/**/*.cli.ts",
    "src/types/component-meta.ts",
    "scripts/generate.ts",
    "${scripts.dir}/measure-cli-pending.ts",
  ]

# Minimum signed contrast margin across the appearance's five darkness samples
# and canonical 7/4.5/3 ink-rung floors. At the polarity crossover, primary
# ink is measured against the maximum contrast the pigment pair can attain.
[standards.field_contrast_margin]
  metric = "field_contrast_margin"
  direction = "up"
  limit = 0
  run = "deno run --config deno.json --allow-read ${scripts.dir}/measure-contrast-margin.ts"
  inputs = ["src/tokens/**", "${scripts.dir}/measure-contrast-margin.ts"]

# Component spacing and offsets consume the shared spacing roles. This raw
# legacy population may only fall until the density sweep replaces it at zero.
[standards.raw_spacing]
  metric = "raw_spacing"
  direction = "down"
  limit = 0
  run = "deno run --config deno.json --allow-read ${scripts.dir}/measure-raw-spacing.ts"
  inputs = [
    "src/components/**/*.css",
    "${scripts.dir}/component-css-metrics.ts",
    "${scripts.dir}/measure-raw-spacing.ts",
  ]

# Component edges and shadows consume public structure roles. Local colour
# aliases and raw paint stay measurable until the structure sweep reaches zero.
[standards.untokenised_structure]
  metric = "untokenised_structure"
  direction = "down"
  limit = 0
  run = "deno run --config deno.json --allow-read ${scripts.dir}/measure-untokenised-structure.ts"
  inputs = [
    "src/components/**/*.css",
    "${scripts.dir}/component-css-metrics.ts",
    "${scripts.dir}/measure-untokenised-structure.ts",
  ]

# Canonical Web examples name every tone or status with visible text or an
# accessibly named glyph. Production mode is explicit so React renders a
# deterministic static projection instead of reading an ambient mode.
[standards.missing_witnesses]
  metric = "missing_witnesses"
  direction = "down"
  limit = 0
  run = "NODE_ENV=production deno run --config deno.json --allow-read --allow-env=NODE_ENV ${scripts.dir}/measure-missing-witnesses.ts"
  inputs = [
    "src/components/**/*.tsx",
    "src/components/**/*.meta.ts",
    "src/types/component-examples.ts",
    "catalogue/conformance.ts",
    "catalogue/web-examples.ts",
    "scripts/build.ts",
    "${scripts.dir}/measure-missing-witnesses.ts",
  ]

# Coverage — keep line coverage at or above a rising floor:
# [standards.coverage]
  # direction = "up"
  # limit     = 80
  # run       = "your-coverage-tool"   # must emit: DISCERN_METRIC coverage <percent>
#
# Bundle size — a raw count is right here: shipped bytes are a true budget, they
# don't grow just because the repo does. Keep the artifact under a falling ceiling:
# [standards.bundle]
  # metric    = "bundle_bytes"
  # direction = "down"
  # limit     = 500000
  # run       = "printf 'DISCERN_METRIC bundle_bytes %s\\n' \"$(wc -c < dist/app.js)\""
#
# Lint density — a RATE, for a count that WOULD grow with the project. Divide by a
# built-in extent so adding clean code never breaches it, only nittier code does:
# [standards.lint_density]
  # metric    = "warnings"
  # direction = "down"
  # per       = { lines = "src/**" }   # discern counts the lines itself
  # scale     = 1000                   # express "warnings per 1,000 lines"
  # limit     = 5
  # run       = "your-linter --count"  # must emit: DISCERN_METRIC warnings <count>

# ─────────────────────────────────────────────────────────────────────────────
# [checkpoints.<name>]
#
# What:    Change-triggered review rules.
# Why:     A deterministic trigger decides when a change makes a question
#          relevant; the agent answers the question and the answer travels with
#          the Proof. The configuration at an effort's merge-base governs, so
#          editing these tables on a branch never changes that branch's own
#          Gate.
#
# Naming a shipped checkpoint enables it with its built-in trigger, mode,
# and question; a field set beneath it overrides the built-in. Delete or
# comment out an entry to disable it.
#
# Params:  scope, paths, include_generated, exclude_paths, unless_changed,
#          kinds, adds_matching, removes_matching, new_directory, binary,
#          min_changed_files, min_changed_lines, deletion_dominant,
#          similar_new_file, min_commits, when, mode, question, question_file,
#          teach, reference
# Help:    `discern config explain checkpoints`
# ─────────────────────────────────────────────────────────────────────────────

# Shipped built-ins: referencing an id enables it — the trigger, mode, and
# question come from the built-in, and any field set here overrides its
# default (retune with min_changed_files, retarget with paths/scope, soften
# with mode = "advise"). Delete or comment out an entry to disable it.
# Overriding `question` or `question_file` replaces the shipped judgment with
# your own authored prose.
#
# Four stop checkpoints guard the knowledge surfaces — the ones that steer
# every future agent session. `discern done` pauses before the gate until the
# agent declares each fired question met, or unmet with a rationale:
[checkpoints.map-focus] # a broad map change must reduce future reading
[checkpoints.instruction-economy] # always-loaded prose pays rent in every session
[checkpoints.skills-playbook] # a skill is an executable playbook
[checkpoints.gotchas-playbook] # failure memory stays symptom → cause → recovery
# (quiet until [project].gotchas_doc names a doc)

# Six advisory checkpoints read the shape of the change — never blocking,
# delivered with the gate's advisories when their pattern appears:
[checkpoints.deletion-heavy-change] # a substantial cut: proven dead, recoverable?
[checkpoints.parallel-implementation] # a name-similar sibling file appeared
[checkpoints.new-binary-asset] # a newly added binary needs reviewable provenance
[checkpoints.effort-sprawl] # one effort, or several riding along?
[checkpoints.map-drift] # code moved and the map did not
[checkpoints.commit-story] # a large change: do the messages tell the why?
# Stack-aware examples, inert until you name your paths: discern never guesses
# your stack, so these ship commented out with the question already written.
# Uncomment one, point its globs at your real files, and it governs new
# efforts once the change lands on the trunk.

# A new dependency is a liability the owner carries — license, supply chain,
# upkeep. Point `paths` at your manifest(s), for example:
#   package.json (JS/TS)        Cargo.toml (Rust)     go.mod (Go)
#   pyproject.toml (Python)     Gemfile (Ruby)        composer.json (PHP)
#   pom.xml, build.gradle* (JVM)                      *.csproj (.NET)
# [checkpoints.new-dependency]
  # paths = ["package.json"]
  # mode  = "advise"
  # question = """
  # This change edits a dependency manifest. For each dependency added or
  # upgraded: is it worth the liability it adds — license fit, supply-chain
  # exposure, maintenance horizon — against writing the small part you need?
  # State what it buys.
  # """

# A deleted or skipped test is a lowered guard. Point `paths` at your test
# tree(s); deletion dominance keeps ordinary test refactors quiet:
# [checkpoints.shrinking-tests]
  # paths             = ["tests/**"]
  # deletion_dominant = true
  # mode              = "advise"
  # question = """
  # This change removes clearly more test than it adds. Is every removed or
  # skipped case re-covered elsewhere, or is the narrowed protection deliberate?
  # Say which in the commit body — a guard lowered silently is how regressions
  # return.
  # """

# Some regions deserve a stated risk before anything lands — authentication,
# billing, data migrations, anything where a mistake leaks or breaks. Name
# the regions the owner watches; `stop` (the default) holds `discern done`
# until the agent declares its conclusion:
# [checkpoints.sensitive-paths]
  # paths = ["src/auth/**", "migrations/**"]
  # question = """
  # This change touches a region the owner marked sensitive. What could break
  # or leak if this is wrong, what protects against that, and what should a
  # reviewer look at first?
  # """

# A project-authored checkpoint: when the interface changed, its contract docs
# were either updated too or consciously judged unaffected.
# [checkpoints.interface-review]
  # paths          = ["src/api/**"]
  # unless_changed = ["docs/api/**"]
  # question      = """
  # A changed interface is described in its docs before it lands: new entry points
  # state their failure modes; changed contracts note what callers must revisit.
  # """

# ─────────────────────────────────────────────────────────────────────────────
# [gate]
#
# What:    How `discern done` runs its parallel stages.
# Why:     Fail-fast, a per-command time budget, and a cap on concurrent test
#          runs keep the Gate fast for one agent and fair across a fleet of
#          worktrees sharing one machine.
#
# Help:    `discern config explain gate`
# ─────────────────────────────────────────────────────────────────────────────

[gate]
  # false groups each job's complete output in a static transcript; true
  # streams prefixed lines. Live terminals always show the Gate frame's bounded
  # tail; CI, pipes, and --plain are static.
  stream = false

  # Cancel the in-flight sibling commands the moment one fails; an agent-driven
  # Gate wants a fast abort. false runs every job and shows all failures in one
  # pass.
  fail_fast = true

  # Time budget in seconds for every command the Gate runs. A command that
  # overruns is tree-killed and the stage fails with a timeout diagnostic, so a
  # watch-mode runner cannot hang the Gate. 0 removes the bound.
  timeout = 600

  # Cap on test-stage runs in flight at once across every checkout of this
  # repository; a run past it waits for a slot. 0 means no cap. Wrap the
  # project's test task in `discern queue -- <command>` to share it.
  concurrent_test_runs = 1

# ─────────────────────────────────────────────────────────────────────────────
# [coupling]
#
# What:    Co-change detection from git history.
# Why:     Files that habitually change together point at a sibling the current
#          change may be missing. Coupling is read-only advice that calibrates
#          itself to the repository, with no thresholds to tune; `discern
#          coupling` reads it on demand.
#
# Help:    `discern config explain coupling`
# ─────────────────────────────────────────────────────────────────────────────

[coupling]
  # Surface coupling findings as trailing hints in `discern done` and `discern
  # prepare`, while the change is hot. false keeps coupling available through
  # `discern coupling` alone.
  in_gate = true

# ─────────────────────────────────────────────────────────────────────────────
# [scripts]
#
# What:    Where your executable project scripts live.
# Why:     `discern scripts <name>` resolves the name literally, runs it from
#          the project root with `DISCERN_ROOT`, `DISCERN_TOML`,
#          `DISCERN_SCRIPTS_DIR`, and `DISCERN_TRUNK`, and forwards every
#          argument. Other config stays available through `discern config get`.
#
# Help:    `discern config explain scripts`
# ─────────────────────────────────────────────────────────────────────────────

[scripts]
  # Where your project scripts live, relative to the project root. The default
  # works with no config; point it elsewhere, such as "tools/", if you prefer.
  dir = "discern/scripts"

# ─────────────────────────────────────────────────────────────────────────────
# [meta]
#
# What:    Installer bookkeeping.
# Why:     discern writes these keys while setting up or upgrading the project.
#          They record schema and setup evidence; nothing here needs
#          hand-editing.
#
# Help:    `discern config explain meta`
# ─────────────────────────────────────────────────────────────────────────────

[meta]
  bootstrapped = true
  setup_model = "claude-fable-5"
  setup_version = "1.0.0"
  # The install schema version. `discern upgrade` bumps it; never edit it by
  # hand.
  schema_version = 1
