name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install dependencies
        run: deno install --frozen
      - name: Install pinned capture browser
        run: deno run -A npm:playwright@1.61.1 install --with-deps chromium
      - name: Generated output is current
        run: |
          deno task codegen
          git diff --exit-code
      - name: Verify
        run: deno task verify
      - name: Publish dry run
        run: deno publish --dry-run
